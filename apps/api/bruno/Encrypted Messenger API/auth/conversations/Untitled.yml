info:
  name: Untitled
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/conversations/direct"
  body:
    type: json
    data: |-
      {
        "recipientUserId": "{{newUserId}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (
          res.getStatus() === 200 ||
          res.getStatus() === 201
        ) {
          bru.setVar('conversationId', res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

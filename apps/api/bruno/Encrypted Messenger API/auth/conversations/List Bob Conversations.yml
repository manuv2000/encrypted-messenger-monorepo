info:
  name: List Bob Conversations
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/conversations?limit=50"
  params:
    - name: limit
      value: "50"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

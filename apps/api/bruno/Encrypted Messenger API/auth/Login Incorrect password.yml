info:
  name: Login Incorrect password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "Deliberately-Incorrect-Password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('incorrect password returns 401', function () {
          expect(res.getStatus()).to.equal(401);
        });

        test('response does not contain a token', function () {
          expect(res.getBody()).not.to.have.property('accessToken');
        });

        test('response uses a generic authentication error', function () {
          expect(res.getBody().message).to.equal('Invalid email or password');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

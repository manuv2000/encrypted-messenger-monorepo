info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const body = res.getBody();

          bru.setVar('accessToken', body.accessToken);
          bru.setVar('refreshToken', body.refreshToken);
        }
    - type: tests
      code: |-
        test('refresh returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('refresh rotates both tokens', function () {
          const body = res.getBody();

          expect(body.accessToken).to.be.a('string');
          expect(body.refreshToken).to.be.a('string');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

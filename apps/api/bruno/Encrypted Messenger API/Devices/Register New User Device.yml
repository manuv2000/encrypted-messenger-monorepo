info:
  name: Register New User Device
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/devices"
  body:
    type: json
    data: |-
      {
        "name": "New User Test Device"
      }
  auth:
    type: bearer
    token: "{{newUserAccessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar('newUserDeviceId', res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

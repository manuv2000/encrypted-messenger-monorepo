info:
  name: List New User Recipient Devices
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/{{newUserId}}/devices"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

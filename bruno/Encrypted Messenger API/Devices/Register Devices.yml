info:
  name: Register Devices
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/devices"
  body:
    type: json
    data: |-
      {
        "name": "New User device"
      }
  auth:
    type: bearer
    token: "{{newUserAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

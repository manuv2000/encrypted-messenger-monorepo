info:
  name: Auth / Current user
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth:
    type: bearer
    token: "{{newUserAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('valid JWT returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('response contains the current user', function () {
          const body = res.getBody();

          expect(body).to.have.property('id');
          expect(body).to.have.property('email');
          expect(body.email).to.equal(bru.getEnvVar('email').toLowerCase());
        });

        test('response does not expose password data', function () {
          const body = res.getBody();

          expect(body).not.to.have.property('password');
          expect(body).not.to.have.property('passwordHash');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

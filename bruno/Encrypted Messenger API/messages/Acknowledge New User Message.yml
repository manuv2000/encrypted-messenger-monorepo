info:
  name: Acknowledge New User Message
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/devices/{{newUserDeviceId}}/messages/{{receivedMessageId}}/ack"
  auth:
    type: bearer
    token: "{{newUserAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
